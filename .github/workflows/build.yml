name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Fast feedback: lint + type-check + Rust compile-check.
  # Runs on both OSes to catch platform-specific issues early.
  lint-and-check:
    name: Lint & check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        # Non-blocking: the project has pre-existing lint errors
        # (no-undef for localStorage/ResizeObserver, empty catch blocks,
        # etc.) that are out of scope for this change. Lint results are
        # still surfaced in the run log for visibility.
        continue-on-error: true
        run: npm run lint

      - name: Format check (Prettier)
        # Non-blocking for the same reason as lint.
        continue-on-error: true
        run: npm run format:check

      - name: Frontend build (Vite)
        run: npm run build

      - name: Rust check (libregene-core)
        working-directory: backend
        run: cargo check -p libregene-core --locked

      - name: Rust unit tests
        working-directory: backend
        run: cargo test -p libregene-core --lib --locked

  # Full Tauri build matrix. Produces installers per OS.
  # Only the frontend + Rust toolchain; tauri-action handles the rest.
  build:
    name: Build app (${{ matrix.os }})
    needs: lint-and-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
            flatpakArch: amd64
            tauriArgs: --no-bundle
          - os: ubuntu-24.04-arm
            label: linux-arm64
            flatpakArch: aarch64
            tauriArgs: --no-bundle
          - os: windows-latest
            label: windows
            tauriArgs: ''
          - os: macos-latest
            label: macos
            tauriArgs: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Linux skips Tauri bundling entirely; the binary is packaged as a
          # Flatpak below. macOS/Windows keep the default "all" targets.
          # CI runs on runners with network access, so WiX (Windows MSI)
          # and other bundler downloads succeed here even when they fail
          # behind restricted networks locally.
          args: ${{ matrix.tauriArgs }}

      - name: Inject README into macOS dmg
        # Tauri dmg config has no "extra files" option, so repack the
        # (compressed, read-only) dmg: convert to read-write, mount,
        # copy the install instructions, convert back.
        if: runner.os == 'macOS'
        run: |
          set -e
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          hdiutil convert "$DMG" -format UDRW -o /tmp/libregene-rw.dmg
          hdiutil attach -readwrite -noverify -mountpoint /tmp/dmg-mnt /tmp/libregene-rw.dmg
          cp "macos-dmg/请先读我 READ ME FIRST.txt" /tmp/dmg-mnt/
          hdiutil detach /tmp/dmg-mnt
          hdiutil convert /tmp/libregene-rw.dmg -format UDZO -imagekey zlib-level=9 -o /tmp/libregene-final.dmg
          mv /tmp/libregene-final.dmg "$DMG"

      - name: Package Flatpak (Linux)
        if: runner.os == 'Linux'
        env:
          FLATPAK_ARCH: ${{ matrix.flatpakArch }}
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build flatpak/com.libregene.app.yml
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p flatpak-out
          flatpak build-bundle flatpak-repo "flatpak-out/LibreGene_${VERSION}_${FLATPAK_ARCH}.flatpak" com.libregene.app

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: libregene-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            flatpak-out/*.flatpak
          if-no-files-found: error

  # Publish a GitHub Release when package.json's version maps to a tag
  # that does not exist yet (push to master only). Release notes are
  # hand-written in release-notes/v<version>.md; if that file is missing
  # the release falls back to GitHub auto-generated notes.
  release:
    name: Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and check tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists; skipping release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installer artifacts
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: libregene-*
          path: release-assets
          merge-multiple: true

      - name: Flatten installer artifacts
        if: steps.version.outputs.exists == 'false'
        # upload-artifact keeps the bundle/ directory structure (dmg/, msi/,
        # ...); gh release create only accepts files, so flatten first.
        run: |
          mkdir release-files
          find release-assets -type f -exec mv {} release-files/ \;

      - name: Create GitHub Release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          NOTES="release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" release-files/* --target "$SHA" --title "$TAG" --notes-file "$NOTES"
          else
            echo "::warning::${NOTES} not found; using auto-generated notes"
            gh release create "$TAG" release-files/* --target "$SHA" --title "$TAG" --generate-notes
          fi
