[package]
name = "LibreGene"
version = "1.0.0"
edition = "2021"
description = "A desktop plasmid editor"
authors = ["dl-li"]
license = "GPL-3.0-only"

[lib]
name = "libregene_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
libregene-core = { path = "../backend/libregene-core" }
log = "0.4"
tauri-plugin-decoration = "2.1.4"

# Keep the alignment/enzyme engine fast in dev builds.
[profile.dev.package.libregene-core]
opt-level = 2
